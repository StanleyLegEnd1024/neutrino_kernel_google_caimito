name: Neutrino Caimito Final

on:
  workflow_dispatch: # 必须有这一行，按钮才会出现

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        path: neutrino_src
        submodules: recursive
        fetch-depth: 1

    # 1. 磁盘清理
    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_tool_cache: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"

    # 2. 准备构建环境 (Repo & Tools)
    - name: Setup Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential bc bison flex libssl-dev libncurses5-dev libelf-dev python3 rsync curl wget zip unzip
        
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        
        git config --global user.name "Bot"
        git config --global user.email "bot@localhost"

    # 3. 初始化 Google 环境
    - name: Init GKI
      run: |
        mkdir -p android_kernel
        cd android_kernel
        # 初始化 Android 14 6.1 分支
        repo init -u https://android.googlesource.com/kernel/manifest -b common-android14-6.1 --depth=1
        # 只同步必要部分
        repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle build build/kernel prebuilts/clang/host/linux-x86 prebuilts/build-tools kernel/configs

    # 4. 植入你的源码
    - name: Inject Source
      run: |
        cd android_kernel
        rm -rf common
        mv ../neutrino_src common
        echo "KERNEL_ROOT=$(pwd)" >> $GITHUB_ENV

    # 5. 配置内核 (KSU/SUSFS)
    - name: Configure
      run: |
        cd $KERNEL_ROOT
        DEFCONFIG="common/arch/arm64/configs/neutrino_caimito_defconfig"
        
        # 修复 dirty
        sed -i 's/-dirty//' common/scripts/setlocalversion || true
        
        # 写入配置
        if [ -f "$DEFCONFIG" ]; then
          grep -q "CONFIG_KSU=y" "$DEFCONFIG" || echo 'CONFIG_KSU=y' >> "$DEFCONFIG"
          grep -q "CONFIG_KSU_SUSFS=y" "$DEFCONFIG" || echo 'CONFIG_KSU_SUSFS=y' >> "$DEFCONFIG"
          sed -i '/CONFIG_LOCALVERSION/d' "$DEFCONFIG"
          echo 'CONFIG_LOCALVERSION="-Neutrino-Caimito"' >> "$DEFCONFIG"
        else
          echo "Config not found!"
          exit 1
        fi

    # 6. 开始编译 (Bazel)
    - name: Build
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        # 使用 Thin LTO
        tools/bazel build --config=fast --lto=thin //common:kernel_aarch64_dist

    # 7. 打包 AnyKernel3
    - name: Package AK3
      run: |
        # 克隆 AK3
        git clone https://github.com/osm0sis/AnyKernel3.git
        rm -rf AnyKernel3/.git
        
        # 查找镜像 (lz4 或普通镜像)
        # 使用 Shell 变量而非 Actions 变量，防止解析错误
        IMG=$(find $KERNEL_ROOT/bazel-bin -name "Image.lz4" | head -n 1)
        
        if [ -z "$IMG" ]; then
             IMG=$(find $KERNEL_ROOT/bazel-bin -name "Image" | head -n 1)
        fi
        
        if [ -f "$IMG" ]; then
             echo "Found image: $IMG"
             cp "$IMG" AnyKernel3/
        else
             echo "Error: Kernel Image not found!"
             exit 1
        fi
        
        # 查找模块
        mkdir -p AnyKernel3/modules/system/lib/modules/
        find $KERNEL_ROOT/bazel-bin -name "*.ko" -exec cp {} AnyKernel3/modules/system/lib/modules/ \; || true
        
        # 压缩
        cd AnyKernel3
        zip -r9 ../Neutrino-Pixel9-AK3.zip *

    # 8. 上传
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Neutrino-Pixel9-AK3
        path: Neutrino-Pixel9-AK3.zip
