name: Build Neutrino Caimito (Pixel 9)

on:
  workflow_dispatch: # 手动触发

jobs:
  build:
    name: Build Kernel for Pixel 9
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 1. 释放磁盘空间 (GKI/Bazel 编译极其占用空间，这是从你给的脚本里学的)
    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_tool_cache: true
        remove_folders: "/usr/share/swift /usr/local/lib/node_modules /usr/local/share/powershell"

    # 2. 安装必要工具
    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential bc bison flex libssl-dev python3 curl wget rsync
        # 准备 repo 工具
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    # 3. 自定义内核名称 (仿照你给的脚本逻辑)
    - name: Customize Localversion
      run: |
        # 去掉 -dirty 标志并添加 Neutrino 标识
        sed -i 's/-dirty//' ./common/scripts/setlocalversion || true
        # 如果你想改内核名字，可以在这里操作
        echo "CONFIG_LOCALVERSION=\"-Neutrino-Caimito\"" >> common/arch/arm64/configs/gki_defconfig

    # 4. 执行 Bazel 编译 (Pixel 9 专用方式)
    - name: Build with Bazel
      run: |
        # 使用 Thin LTO 提速并减少内存消耗
        # Pixel 9 的 target 通常是 //common:kernel_aarch64_dist
        set -ex
        chmod +x tools/bazel
        ./tools/bazel build --config=fast --lto=thin //common:kernel_aarch64_dist

    # 5. 整理产物 (Image 和 模块)
    - name: Collect Artifacts
      run: |
        mkdir -p output
        # Bazel 产物通常在 bazel-bin 目录下
        find bazel-bin/common/kernel_aarch64/ -name "Image*" -exec cp {} output/ \;
        find bazel-bin/common/kernel_aarch64/ -name "*.ko" -exec cp {} output/ \;

    # 6. 打包 AnyKernel3 (如果你有这个需求)
    - name: Prepare AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        rm -rf AnyKernel3/.git
        cp output/Image AnyKernel3/
        # 根据 Pixel 9 调整 anykernel.sh 的逻辑可以在这里用 sed 改
        zip -r9 neutrino-kernel.zip AnyKernel3/*

    # 7. 上传
    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: Neutrino-Caimito-Kernel
        path: |
          output/Image
          neutrino-kernel.zip
