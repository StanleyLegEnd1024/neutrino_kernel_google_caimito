name: Test Kernel Build Start

on:
  workflow_dispatch:

jobs:
  build:
    name: Test Compilation Start
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      KERNEL_DIR: common
      OUT_DIR: out
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_HOST: GitHub-Action
      KBUILD_BUILD_USER: neutrino

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        path: common
        submodules: recursive
        fetch-depth: 1

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git build-essential bc bison flex libssl-dev libncurses5-dev \
          libelf-dev python3 rsync curl wget zip unzip file cpio lld \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu \
          device-tree-compiler

    - name: Download Neutron Clang
      run: |
        mkdir -p toolchains/clang
        cd toolchains/clang
        curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
        chmod +x antman
        ./antman -S
        echo "$GITHUB_WORKSPACE/toolchains/clang/bin" >> $GITHUB_PATH

    - name: Build Kernel (Test)
      run: |
        set -e
        export ROOT_DIR=$(pwd)
        export KERNEL_DIR=common
        export OUT_DIR=out
        
        # 核心 GKI 变量（解决死循环的关键）
        export KMI_GENERATION=11
        export LLVM=1
        export LLVM_IAS=1
        export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"
        
        # 显式设置 PATH
        export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
        
        cd common
        
        echo "🔹 Configuring Kernel..."
        make O=../$OUT_DIR ARCH=arm64 neutrino_caimito_defconfig
        
        echo "🔹 Starting Build..."
        # 只编译 Image，足以验证编译是否正常开始
        make O=../$OUT_DIR ARCH=arm64 \
             LLVM=1 LLVM_IAS=1 \
             CROSS_COMPILE=aarch64-linux-gnu- \
             CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
             LD=ld.lld AR=llvm-ar NM=llvm-nm \
             OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
             -j$(nproc --all) \
             Image
