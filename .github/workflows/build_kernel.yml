name: Neutrino Caimito Standard Build

on:
  workflow_dispatch: # 手动点火

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600 # 仿参考脚本的高时限

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    # 1. [span_3](start_span)深度磁盘清理 (完全照抄参考脚本逻辑)[span_3](end_span)
    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"

    # 2. 核心缓存控制：工具链与编译器 (确保不消失)
    - name: Toolchain Cache
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: toolchains/clang
        key: clang-r487747c-caimito-v1 # 只要这个 Key 不改，环境就不会没

    # 3. [span_4](start_span)初始化编译环境 (参考源代码 11-12)[span_4](end_span)
    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential bc bison flex libssl-dev libncurses5-dev libelf-dev python3 rsync curl wget
        
        # 如果缓存没中，才执行下载
        if [ "${{ steps.cache-toolchain.outputs.cache-hit }}" != 'true' ]; then
          mkdir -p toolchains/clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz" -o clang.tar.gz
          tar -C toolchains/clang -zxf clang.tar.gz
          rm clang.tar.gz
        fi
        
        # 将 Clang 加入系统路径 (这是持久化的关键)
        echo "$GITHUB_WORKSPACE/toolchains/clang/bin" >> $GITHUB_PATH

    # 4. 适配你的目录结构 (修复找不到 common 的问题)
    - name: Path Fix & Localversion
      run: |
        # 自动探测 setlocalversion 位置
        SET_LOCAL_VER=$(find . -name setlocalversion | head -n 1)
        if [ -n "$SET_LOCAL_VER" ]; then
          sed -i 's/-dirty//' "$SET_LOCAL_VER"
          echo "✅ Fixed $SET_LOCAL_VER"
        fi
        
        # 定位 defconfig
        CONF="arch/arm64/configs/neutrino_caimito_defconfig"
        if [ -f "$CONF" ]; then
          # [span_5](start_span)参考脚本的 KSU 配置注入逻辑[span_5](end_span)
          cat >> "$CONF" << 'EOF'
        CONFIG_KSU=y
        CONFIG_KSU_SUSFS=y
        CONFIG_LOCALVERSION="-Neutrino-Caimito"
        EOF
          echo "✅ Config $CONF patched."
        fi

    # 5. [span_6](start_span)执行编译 (Pixel 9 专用 Bazel 模式)[span_6](end_span)
    - name: Build Kernel (Bazel Mode)
      run: |
        set -ex
        # 如果有 build_caimito.sh 则运行，否则尝试 Bazel
        if [ -f "build_caimito.sh" ]; then
          chmod +x build_caimito.sh
          ./build_caimito.sh
        elif [ -f "tools/bazel" ]; then
          ./tools/bazel build --config=fast --lto=thin //common:kernel_aarch64_dist
        else
          # 传统 Make 模式
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang neutrino_caimito_defconfig
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang -j$(nproc --all)
        fi

    # 6. [span_7](start_span)[span_8](start_span)打包上传 (包含 AnyKernel3 逻辑)[span_7](end_span)[span_8](end_span)
    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Neutrino-Kernel-Caimito
        path: |
          out/arch/arm64/boot/Image*
          arch/arm64/boot/Image*
          bazel-bin/common/kernel_aarch64/Image*
