name: Build Neutrino Caimito (Pixel 9)

on:
  workflow_dispatch: # 手动触发构建

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_tool_cache: true
        remove_folders: "/usr/share/swift /usr/local/lib/node_modules /usr/local/share/powershell"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential bc bison flex libssl-dev libncurses5-dev \
        libelf-dev python3 tar cpio unzip rsync curl wget

    - name: Setup Toolchain (Google Clang)
      run: |
        mkdir -p toolchains/clang
        # 下载适配 Pixel 9 / GKI 6.1 的 Clang r487747c
        curl -LSs https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz -o clang.tar.gz
        tar -C toolchains/clang -zxf clang.tar.gz
        # 将路径加入系统环境
        echo "$GITHUB_WORKSPACE/toolchains/clang/bin" >> $GITHUB_PATH

    - name: Customize Localversion & Config
      run: |
        # 1. 修复 setlocalversion (去掉 -dirty)
        SET_LOCAL_VER=$(find . -name setlocalversion | head -n 1)
        if [ -n "$SET_LOCAL_VER" ]; then
          sed -i 's/-dirty//' "$SET_LOCAL_VER"
          echo "✅ Fixed $SET_LOCAL_VER"
        fi
        
        # 2. 定位并修改你的机型配置文件 (基于你提供的路径)
        TARGET_CONFIG="arch/arm64/configs/neutrino_caimito_defconfig"
        
        if [ -f "$TARGET_CONFIG" ]; then
          # 注入内核版本标识
          echo "CONFIG_LOCALVERSION=\"-Neutrino-Caimito\"" >> "$TARGET_CONFIG"
          # 确保 KSU 和 SUSFS 已开启 (虽然作者已集成，但加个保险)
          echo "CONFIG_KSU=y" >> "$TARGET_CONFIG"
          echo "CONFIG_KSU_SUSFS=y" >> "$TARGET_CONFIG"
          echo "✅ Successfully customized $TARGET_CONFIG"
        else
          echo "❌ Error: Could not find $TARGET_CONFIG"
          exit 1
        fi

    - name: Build Kernel
      run: |
        set -ex
        
        # 定义环境变量
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        export NM=llvm-nm
        export AR=llvm-ar
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip

        # 如果有作者的脚本优先运行
        if [ -f "build_caimito.sh" ]; then
          chmod +x build_caimito.sh
          ./build_caimito.sh
        else
          # 使用传统的 Make 方式编译
          make O=out neutrino_caimito_defconfig
          make O=out -j$(nproc --all)
        fi

    - name: Collect Results
      run: |
        mkdir -p output
        # 查找生成的 Image (通常在 out/arch/arm64/boot/)
        find out/arch/arm64/boot/ -name "Image*" -exec cp {} output/ \; || \
        find arch/arm64/boot/ -name "Image*" -exec cp {} output/ \;
        
        # 复制可能存在的内核模块
        find . -name "*.ko" -exec cp {} output/ \; || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Neutrino-Kernel-Caimito
        path: output/*
