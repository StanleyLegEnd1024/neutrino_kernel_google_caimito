name: Build Neutrino Kernel for Pixel 9 (Caimito)

on:
  workflow_dispatch: # 允许手动触发构建
  push:
    branches:
      - main
      - neutrino-google-caimito-6.1 # 根据你的实际分支名修改，如果不确定可以保留这个或者用 '*'

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.ref }}
        submodules: recursive
        fetch-depth: 0

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential bc bison flex libssl-dev libncurses5-dev \
        libelf-dev python3 tar cpio unzip rsync curl wget

    - name: Download Clang Toolchain
      run: |
        mkdir -p toolchains/clang
        # 下载 Android 官方 Clang (r416183b 是 Android 14/GKI 常用版本，如需更新可修改)
        # 如果 Neutrino 推荐特定版本，请在此调整
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r487747c.tar.gz -O clang.tar.gz
        tar -C toolchains/clang -zxf clang.tar.gz
        
        # 设置环境变量
        echo "PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH" >> $GITHUB_ENV
        echo "CLANG_PATH=$GITHUB_WORKSPACE/toolchains/clang" >> $GITHUB_ENV

    - name: Build Kernel (Attempt 1: build_caimito.sh)
      id: build_script
      run: |
        if [ -f "build_caimito.sh" ]; then
          echo "Found build_caimito.sh, granting permissions..."
          chmod +x build_caimito.sh
          
          # 尝试修改脚本以适配 CI 环境（如果脚本假定有上级 prebuilts 目录）
          # 这一步是预防性措施，强制指定 Clang 路径
          sed -i 's|^CLANG_PREBUILT_BIN=.*|CLANG_PREBUILT_BIN=../toolchains/clang/bin|g' build_caimito.sh || true
          
          echo "Running build script..."
          # 传递参数，通常 GKI 构建不需要过多参数，但有些脚本需要
          ./build_caimito.sh
          echo "BUILD_STATUS=success" >> $GITHUB_ENV
        else
          echo "build_caimito.sh not found, skipping to generic build..."
          echo "BUILD_STATUS=skipped" >> $GITHUB_ENV
        fi

    - name: Build Kernel (Fallback: Generic Make)
      if: env.BUILD_STATUS == 'skipped'
      run: |
        echo "Using generic GKI build method..."
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        
        # 尝试寻找 defconfig，Pixel 9 通常是 caimito_defconfig 或 gki_defconfig
        if [ -f "arch/arm64/configs/caimito_defconfig" ]; then
            make caimito_defconfig
        elif [ -f "arch/arm64/configs/gki_defconfig" ]; then
            make gki_defconfig
        else
            echo "No suitable defconfig found!"
            exit 1
        fi
        
        make -j$(nproc)

    - name: Locate Artifacts
      id: locate_artifacts
      run: |
        echo "Searching for kernel images..."
        # 查找常见的内核镜像文件
        find . -name "Image*" -o -name "*.ko" -o -name "boot.img" -o -name "dtbo.img"
        
        # 创建输出目录
        mkdir -p release_artifacts
        
        # 尝试复制关键文件
        find out/ -name "Image.lz4" -exec cp {} release_artifacts/ \; || true
        find out/ -name "Image" -exec cp {} release_artifacts/ \; || true
        find out/ -name "*.ko" -exec cp {} release_artifacts/ \; || true
        # 如果有 AnyKernel3 打包脚本生成的 zip
        find . -name "*.zip" -exec cp {} release_artifacts/ \; || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-release
        path: release_artifacts/*
