name: Neutrino Caimito Ultimate Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel for Pixel 9
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        path: common
        submodules: recursive
        fetch-depth: 1

    # 1. 深度磁盘清理
    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"

    # 2. 缓存工具链 (Key 更新为 neutron 以区分旧缓存)
    - name: Cache Toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: toolchains/clang
        key: neutron-clang-19

    # 3. 设置环境与下载 Neutron Clang (彻底修复 Google Source 403 问题)
    - name: Setup Environment
      run: |
        sudo apt-get update
        # 补充了 cpio, lld 等 Pixel 内核构建常用依赖
        sudo apt-get install -y git build-essential bc bison flex libssl-dev libncurses5-dev libelf-dev python3 rsync curl wget zip unzip file cpio lld
        
        mkdir -p toolchains/clang
        
        # 只有在没有缓存命中时才下载
        if [ "${{ steps.cache-toolchain.outputs.cache-hit }}" != 'true' ]; then
          echo "⬇️ Cache miss, downloading Neutron Clang..."
          cd toolchains/clang
          # 使用 Antman 脚本自动拉取最新的高性能 Clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          cd ../..
        else
          echo "✅ Clang cache hit!"
        fi
        
        # 设置环境变量
        echo "$GITHUB_WORKSPACE/toolchains/clang/bin" >> $GITHUB_PATH
        
    # 4. 准备 AnyKernel3
    - name: Setup AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git -b master
        rm -rf AnyKernel3/.git

    # 5. 源码修补与配置
    - name: Patch Kernel Source
      run: |
        # 进入源码目录操作
        cd common
        
        # 移除 dirty 标记
        if [ -f "scripts/setlocalversion" ]; then
          sed -i 's/-dirty//' scripts/setlocalversion
        fi
        
        # 注入配置
        CONF="arch/arm64/configs/neutrino_caimito_defconfig"
        if [ -f "$CONF" ]; then
          echo 'CONFIG_LOCALVERSION="-Neutrino-Caimito"' >> "$CONF"
          echo 'CONFIG_KSU=y' >> "$CONF"
          echo 'CONFIG_KSU_SUSFS=y' >> "$CONF"
          echo "✅ Config patched: $CONF"
        else
          echo "⚠️ Warning: Config file not found at $CONF"
        fi

    # 6. 执行编译 (修复 Make 模式下的 LLVM 参数)
    - name: Build Kernel
      run: |
        set -ex
        cd common
        
        # 优先检测 Bazel (Pixel 9 官方推荐)
        if [ -f "tools/bazel" ]; then
          echo "🚀 Building with Bazel..."
          ./tools/bazel build --config=fast --lto=thin //common:kernel_aarch64_dist
        else
          echo "🔨 Building with Make..."
          # 关键修复：添加 LLVM=1 LLVM_IAS=1 以使用完整的 Clang 工具链(LD, AR等)
          # 否则会使用系统自带的 GNU ld 导致报错
          make O=../out ARCH=arm64 neutrino_caimito_defconfig
          make O=../out ARCH=arm64 \
               CC=clang \
               LLVM=1 \
               LLVM_IAS=1 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
               -j$(nproc --all)
        fi

    # 7. 智能打包 (增强查找逻辑)
    - name: Package AK3
      run: |
        # 尝试查找不同输出路径下的镜像
        # 1. Bazel 输出路径
        IMG=$(find common/bazel-bin -name "Image.lz4" 2>/dev/null | head -n 1)
        # 2. Make 输出路径
        [ -z "$IMG" ] && IMG=$(find out/arch/arm64/boot -name "Image.lz4" 2>/dev/null | head -n 1)
        # 3. 兜底查找
        [ -z "$IMG" ] && IMG=$(find . -name "Image.lz4" 2>/dev/null | head -n 1)
        # 4. 如果没开启 LZ4 压缩，查找 Image
        [ -z "$IMG" ] && IMG=$(find . -name "Image" 2>/dev/null | head -n 1)

        if [ -f "$IMG" ]; then
          echo "✅ Kernel Image found at: $IMG"
          cp "$IMG" AnyKernel3/
          # 如果是未压缩的 Image，重命名以适配某些 AK3 脚本
          if [[ "$IMG" == *"Image" ]]; then
             mv AnyKernel3/Image AnyKernel3/Image.lz4 2>/dev/null || true
          fi
        else
          echo "❌ Critical Error: No Kernel Image found! Build likely failed."
          exit 1
        fi
        
        # 复制内核模块 (*.ko)
        # 注意：Pixel 9 GKI 可能有上百个模块，这里只查找编译输出目录的，避免把源码里的无关文件拷进去
        find out/ -name "*.ko" -exec cp {} AnyKernel3/ \; 2>/dev/null || true
        find common/bazel-bin/ -name "*.ko" -exec cp {} AnyKernel3/ \; 2>/dev/null || true
        
        # 打包
        cd AnyKernel3
        zip -r9 ../Neutrino-Caimito-AK3-Signed.zip *
        
    # 8. 上传
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Neutrino-Kernel-Caimito
        path: Neutrino-Caimito-AK3-Signed.zip
